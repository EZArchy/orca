<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SQLite Browser</title>
<style>
:root {
  --bg: var(--orca-background, #ffffff);
  --fg: var(--orca-foreground, #0a0a0a);
  --muted: var(--orca-muted, #f5f5f5);
  --muted-fg: var(--orca-muted-foreground, #737373);
  --accent: var(--orca-accent, #f5f5f5);
  --accent-fg: var(--orca-accent-foreground, #171717);
  --border: var(--orca-border, #e5e5e5);
  --input: var(--orca-input, #e5e5e5);
  --primary: var(--orca-primary, #171717);
  --ring: var(--orca-ring, #a3a3a3);
  --destructive: var(--orca-destructive, #dc2626);
  --radius: var(--orca-radius, 6px);
  --ui-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono-font: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --row-h: 22px;
  color-scheme: light;
}
:root.dark {
  --bg: var(--orca-background, #0a0a0a);
  --fg: var(--orca-foreground, #fafafa);
  --muted: var(--orca-muted, #262626);
  --muted-fg: var(--orca-muted-foreground, #a3a3a3);
  --accent: var(--orca-accent, #262626);
  --accent-fg: var(--orca-accent-foreground, #fafafa);
  --border: var(--orca-border, #2e2e2e);
  --input: var(--orca-input, #2e2e2e);
  --primary: var(--orca-primary, #fafafa);
  --ring: var(--orca-ring, #737373);
  --destructive: var(--orca-destructive, #f87171);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 12px/1.4 var(--ui-font); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }

#app { display: grid; grid-template-columns: minmax(160px, 220px) 1fr; grid-template-rows: minmax(0, 1fr) auto; height: 100%; }
#side { border-right: 1px solid var(--border); overflow: auto; padding: 6px 0; }
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#status { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; height: 24px; padding: 0 10px; border-top: 1px solid var(--border); color: var(--muted-fg); white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
#status .grow { flex: 1; }

.side-head { padding: 8px 12px 3px; font-size: 11px; font-weight: 500; color: var(--muted-fg); }
.side-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 24px; padding: 0 12px; border: 0; background: none; text-align: left; cursor: default; }
.side-item:hover { background: var(--accent); color: var(--accent-fg); }
.side-item.active { background: var(--accent); color: var(--accent-fg); font-weight: 500; }
.side-item:focus-visible { outline: 1px solid var(--ring); outline-offset: -1px; }
.side-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-item .count { color: var(--muted-fg); font-variant-numeric: tabular-nums; font-weight: 400; }
.side-item .count.bad { color: var(--destructive); }
.side-empty { padding: 2px 12px; color: var(--muted-fg); }

.notice { padding: 5px 12px; border-bottom: 1px solid var(--border); background: var(--muted); color: var(--muted-fg); }
#toolbar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--border); flex: none; }
#title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#meta { color: var(--muted-fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
#toolbar .grow { flex: 1; }
#filter { width: 200px; height: 24px; padding: 0 8px; border: 1px solid var(--input); border-radius: var(--radius); background: transparent; color: var(--fg); font: inherit; }
#filter:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
#content { position: relative; flex: 1; min-height: 0; }

.grid { position: absolute; inset: 0; overflow: auto; outline: none; font-size: 12px; }
.g-head { position: sticky; top: 0; z-index: 2; display: flex; height: var(--row-h); background: var(--bg); border-bottom: 1px solid var(--border); }
.g-spacer { width: 1px; }
.g-body { position: absolute; left: 0; overflow: clip; }
.g-row { display: flex; height: var(--row-h); }
.g-row.row-sel > .g-cell { background: var(--accent); }
.g-cell { flex: none; height: var(--row-h); padding: 0 8px; line-height: calc(var(--row-h) - 1px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: default; }
.g-head .g-cell { position: relative; font-weight: 500; border-bottom: 0; }
.g-head .g-cell .type { margin-left: 6px; color: var(--muted-fg); font-weight: 400; }
.g-gutter { position: sticky; left: 0; z-index: 1; background: var(--bg); color: var(--muted-fg); text-align: right; font-variant-numeric: tabular-nums; }
.g-head .g-gutter { z-index: 3; font-weight: 400; }
.g-row.row-sel > .g-gutter { background: var(--accent); }
.g-cell.c-num { text-align: right; font-variant-numeric: tabular-nums; }
.g-cell.c-null { color: var(--muted-fg); font-style: italic; }
.g-cell.c-blob { color: var(--muted-fg); }
.g-cell.c-err { color: var(--destructive); }
.g-cell.sel { box-shadow: inset 0 0 0 1px var(--ring); }
.grid:focus .g-cell.sel { box-shadow: inset 0 0 0 2px var(--ring); }
.rz { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 1; }

#sqlview, #info { position: absolute; inset: 0; overflow: auto; padding: 12px; }
.sql-item { margin-bottom: 14px; }
.sql-item .label { margin-bottom: 4px; }
.sql-item .label .kind { color: var(--muted-fg); margin-right: 6px; }
.sql-item .label .name { font-weight: 500; }
pre.sql { margin: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--muted); font: 12px/1.5 var(--mono-font); white-space: pre-wrap; word-break: break-word; user-select: text; }
.info-text { color: var(--muted-fg); margin: 0 0 10px; max-width: 640px; }

#detail { flex: none; height: 160px; max-height: 40%; display: flex; flex-direction: column; border-top: 1px solid var(--border); }
#detail-head { display: flex; gap: 8px; align-items: center; height: 26px; padding: 0 12px; border-bottom: 1px solid var(--border); color: var(--muted-fg); white-space: nowrap; overflow: hidden; }
#detail-head .name { color: var(--fg); font-weight: 500; }
#detail-body { flex: 1; min-height: 0; overflow: auto; padding: 6px 12px; margin: 0; font: 12px/1.5 var(--mono-font); white-space: pre-wrap; word-break: break-word; user-select: text; }
#detail-body.hex { white-space: pre; word-break: normal; }
#detail-body .note { color: var(--muted-fg); font-family: var(--ui-font); }

#message { display: flex; align-items: center; justify-content: center; height: 100%; padding: 24px; }
#message .box { max-width: 460px; }
#message h1 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
#message p { margin: 0 0 6px; color: var(--muted-fg); }
</style>
</head>
<body>
<div id="app" hidden>
  <aside id="side"></aside>
  <main id="main">
    <div id="notices"></div>
    <div id="toolbar">
      <span id="title"></span>
      <span id="meta"></span>
      <span class="grow"></span>
      <input id="filter" type="search" placeholder="Filter rows" spellcheck="false" autocomplete="off" hidden>
    </div>
    <div id="content">
      <div id="grid" class="grid" tabindex="0" hidden>
        <div class="g-head"></div>
        <div class="g-spacer"></div>
        <div class="g-body"><div class="g-rows"></div></div>
      </div>
      <div id="sqlview" hidden></div>
      <div id="info" hidden></div>
    </div>
    <div id="detail" hidden>
      <div id="detail-head"></div>
      <pre id="detail-body"></pre>
    </div>
  </main>
  <footer id="status"></footer>
</div>
<div id="message" hidden><div class="box"><h1></h1><p class="what"></p><p class="todo"></p></div></div>

<script>
/* SQLITE-READER:BEGIN */
// A read-only SQLite file-format reader (https://www.sqlite.org/fileformat2.html). It runs in the
// editor frame and in the node tests, so it uses nothing but plain JS, TextDecoder and BigInt.
var SqliteReader = (function () {
  'use strict'

  var MAGIC = 'SQLite format 3\u0000'
  // SQLite refuses b-trees deeper than 20; a deeper walk means a damaged or looping file.
  var MAX_DEPTH = 40
  // The grid shows short previews, so a 50 MB text value never has to be decoded to draw a row.
  var PREVIEW_BYTES = 1024
  var FIXED_SIZE = [0, 1, 2, 3, 4, 6, 8, 8, 0, 0]
  var ENCODINGS = { 0: 'utf-8', 1: 'utf-8', 2: 'utf-16le', 3: 'utf-16be' }
  var ENCODING_LABELS = { 'utf-8': 'UTF-8', 'utf-16le': 'UTF-16le', 'utf-16be': 'UTF-16be' }

  // Every problem with the file is one of these; `message` is a plain sentence for the user.
  function readError(kind, message) {
    var e = new Error(message)
    e.name = 'SqliteReadError'
    e.kind = kind
    return e
  }
  function damaged(what) {
    return readError('damaged', 'Part of this file is damaged: ' + what + '.')
  }
  function isReadError(e) {
    return !!e && e.name === 'SqliteReadError'
  }
  function messageOf(e) {
    return isReadError(e) ? e.message : 'Part of this file could not be read; it may be damaged.'
  }

  // Varints are big-endian, 7 bits per byte, and the 9th byte keeps all 8 bits. Up to 7 bytes fit
  // a double exactly; longer ones (large or negative rowids) go through BigInt.
  var vlen = 0
  function varint(b, p, end) {
    var v = 0
    var i = 0
    var c
    for (; i < 7; i++) {
      if (p + i >= end) throw damaged('a value runs past the end of its page')
      c = b[p + i]
      v = v * 128 + (c & 0x7f)
      if (c < 0x80) {
        vlen = i + 1
        return v
      }
    }
    var big = BigInt(v)
    for (; i < 9; i++) {
      if (p + i >= end) throw damaged('a value runs past the end of its page')
      c = b[p + i]
      if (i === 8) {
        big = (big << 8n) | BigInt(c)
        vlen = 9
        break
      }
      big = (big << 7n) | BigInt(c & 0x7f)
      if (c < 0x80) {
        vlen = i + 1
        break
      }
    }
    big = BigInt.asIntN(64, big)
    return big >= -9007199254740991n && big <= 9007199254740991n ? Number(big) : big
  }

  // Big-endian two's-complement integer of 1, 2, 3, 4, 6 or 8 bytes.
  function readInt(b, p, n) {
    if (n === 8) {
      var hi = (b[p] << 24) | (b[p + 1] << 16) | (b[p + 2] << 8) | b[p + 3]
      var lo = ((b[p + 4] << 24) >>> 0) + (b[p + 5] << 16) + (b[p + 6] << 8) + b[p + 7]
      if (hi >= -2097152 && hi < 2097152) return hi * 4294967296 + lo
      return (BigInt(hi) << 32n) + BigInt(lo)
    }
    var v = b[p] > 127 ? b[p] - 256 : b[p]
    for (var i = 1; i < n; i++) v = v * 256 + b[p + i]
    return v
  }

  // Drop a multi-byte character cut in half by a preview limit.
  function trimText(b, encName) {
    if (encName !== 'utf-8') return b.subarray(0, b.length & ~1)
    var n = b.length
    var i = n - 1
    while (i >= 0 && n - i <= 4 && (b[i] & 0xc0) === 0x80) i--
    if (i < 0) return b
    var lead = b[i]
    var need = lead >= 0xf0 ? 4 : lead >= 0xe0 ? 3 : lead >= 0xc0 ? 2 : 1
    return n - i < need ? b.subarray(0, i) : b
  }

  // ---- CREATE TABLE parsing -------------------------------------------------------------------

  function isIdStart(c) {
    return (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 95 || c >= 128
  }
  function isDigit(c) {
    return c >= 48 && c <= 57
  }
  var NUMBER_RE = /0[xX][0-9a-fA-F]+|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/y

  function tokenize(sql) {
    var out = []
    var i = 0
    var n = sql.length
    while (i < n) {
      var c = sql.charCodeAt(i)
      if (c <= 32) {
        i++
      } else if (c === 45 && sql.charCodeAt(i + 1) === 45) {
        var eol = sql.indexOf('\n', i)
        i = eol < 0 ? n : eol + 1
      } else if (c === 47 && sql.charCodeAt(i + 1) === 42) {
        var close = sql.indexOf('*/', i + 2)
        i = close < 0 ? n : close + 2
      } else if (c === 34 || c === 39 || c === 96) {
        var q = sql[i]
        var j = i + 1
        var s = ''
        while (j < n) {
          if (sql[j] === q) {
            if (sql[j + 1] === q) {
              s += q
              j += 2
              continue
            }
            j++
            break
          }
          s += sql[j++]
        }
        out.push({ k: c === 39 ? 'str' : 'id', v: s, quoted: true, q: q })
        i = j
      } else if (c === 91) {
        var end = sql.indexOf(']', i + 1)
        if (end < 0) end = n
        out.push({ k: 'id', v: sql.slice(i + 1, end), quoted: true })
        i = end + 1
      } else if (isIdStart(c)) {
        var k = i + 1
        while (k < n) {
          var d = sql.charCodeAt(k)
          if (!(isIdStart(d) || isDigit(d) || d === 36)) break
          k++
        }
        out.push({ k: 'id', v: sql.slice(i, k), quoted: false })
        i = k
      } else if (isDigit(c) || (c === 46 && isDigit(sql.charCodeAt(i + 1)))) {
        NUMBER_RE.lastIndex = i
        var m = NUMBER_RE.exec(sql)
        var text = m ? m[0] : sql[i]
        out.push({ k: 'num', v: text })
        i += text.length
      } else {
        out.push({ k: 'op', v: sql[i] })
        i++
      }
    }
    return out
  }

  function word(t) {
    return t && t.k === 'id' && !t.quoted ? t.v.toUpperCase() : ''
  }
  function isOp(t, v) {
    return !!t && t.k === 'op' && t.v === v
  }
  // Index just past the parenthesised group that opens at `i`.
  function skipGroup(tk, i) {
    var depth = 0
    for (; i < tk.length; i++) {
      if (isOp(tk[i], '(')) depth++
      else if (isOp(tk[i], ')') && --depth === 0) return i + 1
    }
    return i
  }
  // Split the tokens between the parentheses opening at `open` on top-level commas.
  function splitList(tk, open) {
    var items = []
    var cur = []
    var depth = 0
    for (var i = open; i < tk.length; i++) {
      var t = tk[i]
      if (isOp(t, '(')) {
        if (depth++ === 0) continue
      } else if (isOp(t, ')')) {
        if (--depth === 0) {
          items.push(cur)
          return { items: items, close: i }
        }
      } else if (isOp(t, ',') && depth === 1) {
        items.push(cur)
        cur = []
        continue
      }
      cur.push(t)
    }
    return null
  }

  var COLUMN_CONSTRAINT = {
    CONSTRAINT: 1, PRIMARY: 1, NOT: 1, NULL: 1, UNIQUE: 1, CHECK: 1, DEFAULT: 1,
    COLLATE: 1, REFERENCES: 1, GENERATED: 1, AS: 1
  }
  var TABLE_CONSTRAINT = { CONSTRAINT: 1, PRIMARY: 1, UNIQUE: 1, CHECK: 1, FOREIGN: 1 }
  var INT64_MAX = 9223372036854775807n
  var INT64_MIN = -9223372036854775808n

  function affinity(type) {
    var t = type.toUpperCase()
    if (t.indexOf('INT') >= 0) return 'INTEGER'
    if (/CHAR|CLOB|TEXT/.test(t)) return 'TEXT'
    if (t.indexOf('BLOB') >= 0 || t === '') return 'BLOB'
    if (/REAL|FLOA|DOUB/.test(t)) return 'REAL'
    return 'NUMERIC'
  }

  function bigToValue(big) {
    return big >= -9007199254740991n && big <= 9007199254740991n ? Number(big) : big
  }

  // A DEFAULT literal, which is what SQLite fills in for a column added after a row was written.
  // ALTER TABLE ADD COLUMN only allows literals, so expressions are left unknown.
  function parseDefault(tk, j) {
    var t = tk[j]
    var neg = false
    if (isOp(t, '-') || isOp(t, '+')) {
      neg = t.v === '-'
      t = tk[++j]
    }
    if (!t) return undefined
    if (t.k === 'num') {
      if (/^0x/i.test(t.v)) {
        var hex = BigInt.asIntN(64, BigInt(t.v))
        return { type: 'integer', value: bigToValue(neg ? -hex : hex) }
      }
      if (/[.eE]/.test(t.v)) return { type: 'real', value: neg ? -Number(t.v) : Number(t.v) }
      var big = BigInt(t.v)
      if (neg) big = -big
      if (big > INT64_MAX || big < INT64_MIN) return { type: 'real', value: Number(big) }
      return { type: 'integer', value: bigToValue(big) }
    }
    if (neg) return undefined
    // A double-quoted DEFAULT that names no column is a string literal in SQLite.
    if (t.k === 'str' || (t.k === 'id' && t.q === '"')) {
      return { type: 'text', value: t.v }
    }
    var w = word(t)
    if (w === 'NULL') return { type: 'null', value: null }
    if (w === 'TRUE') return { type: 'integer', value: 1 }
    if (w === 'FALSE') return { type: 'integer', value: 0 }
    if (w === 'X' && tk[j + 1] && tk[j + 1].k === 'str' && /^([0-9a-fA-F]{2})*$/.test(tk[j + 1].v)) {
      var h = tk[j + 1].v
      var bytes = new Uint8Array(h.length / 2)
      for (var i = 0; i < bytes.length; i++) bytes[i] = parseInt(h.substr(i * 2, 2), 16)
      return { type: 'blob', value: { size: bytes.length, bytes: bytes } }
    }
    return undefined
  }
  function parseColumn(item) {
    var col = {
      name: item[0].v,
      type: '',
      affinity: 'BLOB',
      pk: false,
      pkDesc: false,
      generated: null,
      dflt: undefined
    }
    var j = 1
    var typeTokens = []
    while (j < item.length && !COLUMN_CONSTRAINT[word(item[j])]) typeTokens.push(item[j++].v)
    col.type = typeTokens.join(' ').replace(/ ?([(),]) ?/g, '$1').replace(/,/g, ', ')
    col.affinity = affinity(col.type)
    while (j < item.length) {
      var w = word(item[j])
      if (w === 'PRIMARY' && word(item[j + 1]) === 'KEY') {
        col.pk = true
        j += 2
        if (word(item[j]) === 'DESC') col.pkDesc = true
      } else if (w === 'DEFAULT') {
        col.dflt = parseDefault(item, j + 1)
        j += isOp(item[j + 1], '(') ? 1 : 2
      } else if (w === 'AS') {
        j++
        if (isOp(item[j], '(')) j = skipGroup(item, j)
        col.generated = word(item[j]) === 'STORED' ? 'stored' : 'virtual'
      } else if (isOp(item[j], '(')) {
        j = skipGroup(item, j)
      } else {
        j++
      }
    }
    return col
  }

  // Columns, primary key, rowid alias and on-disk record order of a CREATE TABLE statement.
  function parseCreateTable(sql) {
    var tk = tokenize(sql)
    var open = -1
    for (var i = 0; i < tk.length; i++) {
      if (isOp(tk[i], '(')) {
        open = i
        break
      }
    }
    if (open < 0) return null
    var list = splitList(tk, open)
    if (!list) return null
    var columns = []
    var tablePk = null
    for (var n = 0; n < list.items.length; n++) {
      var item = list.items[n]
      if (!item.length) continue
      if (TABLE_CONSTRAINT[word(item[0])]) {
        for (var j = 0; j + 2 < item.length; j++) {
          if (word(item[j]) === 'PRIMARY' && word(item[j + 1]) === 'KEY' && isOp(item[j + 2], '(')) {
            var pk = splitList(item, j + 2)
            if (pk) {
              tablePk = pk.items.filter(function (part) { return part.length }).map(function (part) {
                return { name: part[0].v, desc: part.some(function (t) { return word(t) === 'DESC' }) }
              })
            }
            break
          }
        }
        continue
      }
      if (item[0].k !== 'id' && item[0].k !== 'str') return null
      columns.push(parseColumn(item))
    }
    if (!columns.length) return null
    var tail = tk.slice(list.close + 1)
    var withoutRowid = false
    for (var t = 0; t + 1 < tail.length; t++) {
      if (word(tail[t]) === 'WITHOUT' && word(tail[t + 1]) === 'ROWID') withoutRowid = true
    }

    function indexOfColumn(name) {
      var lower = name.toLowerCase()
      for (var c = 0; c < columns.length; c++) if (columns[c].name.toLowerCase() === lower) return c
      return -1
    }
    var pkColumns = []
    var columnPkDesc = false
    var fromColumn = false
    if (tablePk) {
      tablePk.forEach(function (part) {
        var c = indexOfColumn(part.name)
        if (c >= 0 && pkColumns.indexOf(c) < 0) pkColumns.push(c)
      })
    } else {
      for (var c = 0; c < columns.length; c++) {
        if (columns[c].pk) {
          pkColumns.push(c)
          columnPkDesc = columns[c].pkDesc
          fromColumn = true
          break
        }
      }
    }
    pkColumns.forEach(function (c) { columns[c].pk = true })
    // Only a column typed exactly INTEGER aliases the rowid, and SQLite's historical quirk keeps
    // "INTEGER PRIMARY KEY DESC" written on the column itself from being one.
    var rowidAlias = -1
    if (!withoutRowid && pkColumns.length === 1) {
      var only = columns[pkColumns[0]]
      if (only.type.toUpperCase() === 'INTEGER' && !(fromColumn && columnPkDesc)) rowidAlias = pkColumns[0]
    }
    // Record order: virtual generated columns are never stored; a WITHOUT ROWID table stores its
    // primary key columns first.
    var order = []
    if (withoutRowid) order = pkColumns.slice()
    for (var s = 0; s < columns.length; s++) {
      if (columns[s].generated !== 'virtual' && order.indexOf(s) < 0) order.push(s)
    }
    var storage = columns.map(function (_, idx) { return order.indexOf(idx) })
    return {
      columns: columns,
      withoutRowid: withoutRowid,

    tables.forEach(function (t) {
      var count = t.virtual ? 'virtual' : t.error ? '!' : nf.format(t.rowCount)
      el.side.appendChild(sideItem(t.name, t.name, count, !!t.error, t.error || null))
    })
    if (views.length) {
      el.side.appendChild(sideHead('Views'))
      views.forEach(function (v) { el.side.appendChild(sideItem(v.name, v.name, 'view')) })
    }
  }

  el.side.addEventListener('click', function (e) {
    var b = e.target.closest('.side-item')
    if (b) select(b.dataset.name, false)
  })

  function markActive() {
    var items = el.side.querySelectorAll('.side-item')
    for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', items[i].dataset.name === state.selected)
  }

  // ---- Main area -------------------------------------------------------------------------------

  function select(name, keepPosition) {
    var sameTable = keepPosition && name === state.selected
    var scroll = sameTable ? { top: el.grid.scrollTop, left: el.grid.scrollLeft } : null
    state.selected = name
    state.obj = null
    cancelFilter()
    if (!sameTable) {
      state.filterText = ''
      el.filter.value = ''
      state.sel = null
    }
    markActive()
    el.grid.hidden = true
    el.sqlview.hidden = true
    el.info.hidden = true
    el.filter.hidden = true
    el.meta.textContent = ''
    if (name === SCHEMA) {
      el.title.textContent = 'Schema'
      showSchema()
    } else {
      var obj = state.db.objects.filter(function (o) { return o.name === name })[0]
      el.title.textContent = obj.name
      if (obj.type === 'view') showSql(obj, 'A view is a saved query. This viewer reads stored tables only, so it shows the query instead of its rows.')
      else if (obj.virtual) showSql(obj, 'This is a virtual table: the ' + (obj.module || 'module that defines it') + ' produces its rows when queried, so they can’t be read from the file directly.')
      else if (obj.error) showSql(obj, obj.error + ' The other tables can still be browsed.')
      else showTable(obj, scroll)
    }
    renderDetail()
    renderStatus()
  }

  function sqlBlock(obj) {
    var item = document.createElement('div')
    item.className = 'sql-item'
    var label = document.createElement('div')
    label.className = 'label'
    var kind = document.createElement('span')
    kind.className = 'kind'
    kind.textContent = obj.type
    var name = document.createElement('span')
    name.className = 'name'
    name.textContent = obj.name
    label.appendChild(kind)
    label.appendChild(name)
    if (obj.type !== 'table' && obj.tableName && obj.tableName !== obj.name) {
      var on = document.createElement('span')
      on.className = 'kind'
      on.textContent = ' on ' + obj.tableName
      label.appendChild(on)
    }
    var pre = document.createElement('pre')
    pre.className = 'sql'
    pre.textContent = obj.sql || '(created automatically by SQLite for a UNIQUE or PRIMARY KEY constraint)'
    item.appendChild(label)
    item.appendChild(pre)
    return item
  }

  function showSchema() {
    var order = { table: 0, view: 1, index: 2, trigger: 3 }
    var objs = state.db.objects.slice().sort(function (a, b) {
      return order[a.type] - order[b.type] || a.name.localeCompare(b.name)
    })
    el.sqlview.textContent = ''
    if (!objs.length) {
      var p = document.createElement('p')
      p.className = 'info-text'
      p.textContent = state.db.info.empty
        ? 'This database file is empty. SQLite fills it in when the first table is created.'
        : 'This database has no tables, views, indexes or triggers yet.'
      el.sqlview.appendChild(p)
    }
    objs.forEach(function (o) { el.sqlview.appendChild(sqlBlock(o)) })
    el.meta.textContent = nf.format(objs.length) + (objs.length === 1 ? ' object' : ' objects')
    el.sqlview.hidden = false
  }

  function showSql(obj, note) {
    el.sqlview.textContent = ''
    var p = document.createElement('p')
    p.className = 'info-text'
    p.textContent = note
    el.sqlview.appendChild(p)
    el.sqlview.appendChild(sqlBlock(obj))
    el.sqlview.hidden = false
  }

  // ---- Grid ------------------------------------------------------------------------------------

  function viewCount() {
    return state.matches ? state.matches.length : state.obj.rowCount
  }
  function rowIndexOf(v) {
    return state.matches ? state.matches[v] : v
  }

  function readRowSafe(i, full) {
    try {
      return state.db.readRow(state.obj, i, full)
    } catch (e) {
      return { error: R.messageOf(e) }
    }
  }

  function displayColumns(obj) {
    if (obj.columns) {
      return obj.columns.map(function (c) {
        return { name: c.name, type: c.type, title: c.name + (c.type ? ' ' + c.type : '') + (c.pk ? ' · primary key' : '') + (c.generated ? ' · generated' : '') }
      })
    }
    // Unparseable CREATE TABLE: name columns by position from the widest of the first rows.
    var n = 0
    for (var i = 0; i < Math.min(obj.rowCount, 50); i++) {
      var row = readRowSafe(i, false)
      if (row.values) n = Math.max(n, row.values.length)
    }
    var cols = []
    for (var c = 0; c < n; c++) cols.push({ name: 'column' + (c + 1), type: '', title: '' })
    return cols
  }

  var measureCtx = null
  function measure(text) {
    if (!measureCtx) {
      measureCtx = document.createElement('canvas').getContext('2d')
      measureCtx.font = getComputedStyle(el.grid).font
    }
    return measureCtx.measureText(text).width
  }

  function computeWidths() {
    var cols = state.columns
    var widths = cols.map(function (c) { return measure(c.name + (c.type ? '  ' + c.type : '')) + 28 })
    var sample = Math.min(state.obj.rowCount, 200)
    for (var i = 0; i < sample; i++) {
      var row = readRowSafe(i, false)
      if (!row.values) continue
      for (var j = 0; j < cols.length; j++) {
        var view = cellView(row.values[j], row.types[j], row.clipped && row.clipped[j])
        widths[j] = Math.max(widths[j], measure(view.text.slice(0, 60)) + 18)
      }
    }
    state.widths = widths.map(function (w) { return Math.round(Math.min(Math.max(w, 60), 360)) })
    // The gutter fits the widest of the first and last rowids (rowids are sorted, so the extremes).
    var labels = [state.obj.withoutRowid ? '#' : 'rowid', String(state.obj.rowCount)]
    if (!state.obj.withoutRowid && state.obj.rowCount) {
      ;[0, state.obj.rowCount - 1].forEach(function (i) {
        var row = readRowSafe(i, false)
        if (row.rowid != null) labels.push(String(row.rowid))
      })
    }
    state.gutterW = Math.round(Math.max.apply(null, labels.map(measure)) + 20)
  }

  function totalWidth() {
    return state.widths.reduce(function (a, b) { return a + b }, state.gutterW)
  }

  function makeCell(cls, width) {
    var d = document.createElement('div')
    d.className = 'g-cell' + (cls ? ' ' + cls : '')
    d.style.width = width + 'px'
    return d
  }

  function buildHead() {
    gHead.textContent = ''
    var g = makeCell('g-gutter', state.gutterW)
    g.textContent = state.obj.withoutRowid ? '#' : 'rowid'
    gHead.appendChild(g)
    state.columns.forEach(function (c, j) {
      var cell = makeCell('', state.widths[j])
      cell.title = c.title
      cell.appendChild(document.createTextNode(c.name))
      if (c.type) {
        var t = document.createElement('span')
        t.className = 'type'
        t.textContent = c.type
        cell.appendChild(t)
      }
      var rz = document.createElement('div')
      rz.className = 'rz'
      rz.dataset.col = j
      cell.appendChild(rz)
      gHead.appendChild(cell)
    })
  }

  function buildPool() {
    var need = Math.ceil(Math.max(el.grid.clientHeight, 200) / ROW_H) + 2
    if (state.pool.length === need && state.pool.cols === state.columns.length) return
    gRows.textContent = ''
    state.pool = []
    state.pool.cols = state.columns.length
    for (var k = 0; k < need; k++) {
      var row = document.createElement('div')
      row.className = 'g-row'
      row.appendChild(makeCell('g-gutter', state.gutterW))
      for (var j = 0; j < state.columns.length; j++) {
        var c = makeCell('', state.widths[j])
        c.dataset.col = j
        row.appendChild(c)
      }
      gRows.appendChild(row)
      state.pool.push(row)
    }
  }

  function applyWidths() {
    var tw = totalWidth()
    gHead.style.width = tw + 'px'
    gSpacer.style.width = tw + 'px'
    gBody.style.width = tw + 'px'
    var head = gHead.children
    head[0].style.width = state.gutterW + 'px'
    for (var j = 0; j < state.widths.length; j++) head[j + 1].style.width = state.widths[j] + 'px'
    state.pool.forEach(function (row) {
      var cells = row.children
      cells[0].style.width = state.gutterW + 'px'
      for (var j = 0; j < state.widths.length; j++) cells[j + 1].style.width = state.widths[j] + 'px'
    })
  }

  function layoutHeight() {
    var rows = viewCount()
    state.virtualH = Math.min(rows * ROW_H, MAX_SCROLL_PX)
    gSpacer.style.height = state.virtualH + 'px'
  }

  function viewportRowsH() {
    return Math.max(el.grid.clientHeight - ROW_H, 0)
  }

  // Map between the scrollbar and the true row offset; they differ only past MAX_SCROLL_PX.
  function scrollToPos(scrollTop) {
    var real = viewCount() * ROW_H
    if (real <= MAX_SCROLL_PX) return scrollTop
    var span = state.virtualH - viewportRowsH()
    return span > 0 ? (scrollTop / span) * (real - viewportRowsH()) : 0
  }
  function posToScroll(pos) {
    var real = viewCount() * ROW_H
    if (real <= MAX_SCROLL_PX) return pos
    var span = real - viewportRowsH()
    return span > 0 ? (pos / span) * (state.virtualH - viewportRowsH()) : 0
  }

  function showTable(obj, scroll) {
    state.obj = obj
    state.matches = null
    state.columns = displayColumns(obj)
    computeWidths()
    el.filter.hidden = false
    el.grid.hidden = false
    buildHead()
    state.pool = []
    buildPool()
    applyWidths()
    layoutHeight()
    el.grid.scrollTop = scroll ? scroll.top : 0
    el.grid.scrollLeft = scroll ? scroll.left : 0
    renderMeta()
    renderRows()
    if (state.filterText) startFilter()
  }

  function renderMeta() {
    var obj = state.obj
    if (!obj) return
    var cols = state.columns.length
    var text = nf.format(obj.rowCount) + (obj.rowCount === 1 ? ' row' : ' rows') + ' · ' + cols + (cols === 1 ? ' column' : ' columns')
    if (obj.withoutRowid) text += ' · without rowid'
    el.meta.textContent = text
  }

  function renderRows() {
    if (!state.obj || el.grid.hidden) return
    var count = viewCount()
    var top = el.grid.scrollTop
    var pos = scrollToPos(top)
    var first = Math.floor(pos / ROW_H)
    var shift = pos - first * ROW_H
    gBody.style.top = top + ROW_H + 'px'
    gBody.style.height = viewportRowsH() + 'px'
    gRows.style.transform = 'translateY(' + -shift + 'px)'
    var sel = state.sel
    for (var k = 0; k < state.pool.length; k++) {
      var rowEl = state.pool[k]
      var v = first + k
      if (v >= count) {
        rowEl.hidden = true
        continue
      }
      rowEl.hidden = false
      rowEl.dataset.v = v
      var i = rowIndexOf(v)
      var row = readRowSafe(i, false)
      var cells = rowEl.children
      cells[0].textContent = state.obj.withoutRowid || row.error ? String(i + 1) : String(row.rowid)
      rowEl.classList.toggle('row-sel', !!sel && sel.v === v)
      for (var j = 0; j < state.columns.length; j++) {
        var cell = cells[j + 1]
        var view
        if (row.error) view = j === 0 ? { text: row.error, cls: 'c-err' } : { text: '', cls: '' }
        else view = j < row.values.length ? cellView(row.values[j], row.types[j], row.clipped && row.clipped[j]) : { text: '', cls: '' }
        cell.textContent = view.text
        cell.className = 'g-cell' + (view.cls ? ' ' + view.cls : '') + (sel && sel.v === v && sel.col === j ? ' sel' : '')
      }
    }
  }

  el.grid.addEventListener('scroll', function () { renderRows() }, { passive: true })
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(function () {
      if (!state.obj || el.grid.hidden) return
      buildPool()
      applyWidths()
      renderRows()
    }).observe(el.grid)
  }

  // Selection
  gBody.addEventListener('mousedown', function (e) {
    var cell = e.target.closest('.g-cell')
    var rowEl = e.target.closest('.g-row')
    if (!cell || !rowEl || cell.dataset.col == null) return
    setSelection(Number(rowEl.dataset.v), Number(cell.dataset.col), false)
  })

  function setSelection(v, col, reveal) {
    var count = viewCount()
    if (!count || !state.columns.length) return
    v = Math.max(0, Math.min(count - 1, v))
    col = Math.max(0, Math.min(state.columns.length - 1, col))
    state.sel = { v: v, col: col }
    if (reveal) revealSelection()
    renderRows()
    renderDetail()
  }

  function revealSelection() {
    var sel = state.sel
    var pos = scrollToPos(el.grid.scrollTop)
    var rowTop = sel.v * ROW_H
    var h = viewportRowsH()
    if (rowTop < pos) el.grid.scrollTop = posToScroll(rowTop)
    else if (rowTop + ROW_H > pos + h) el.grid.scrollTop = posToScroll(rowTop + ROW_H - h)
    var left = state.gutterW
    for (var j = 0; j < sel.col; j++) left += state.widths[j]
    var right = left + state.widths[sel.col]
    var sl = el.grid.scrollLeft
    var w = el.grid.clientWidth
    if (left - state.gutterW < sl) el.grid.scrollLeft = left - state.gutterW
    else if (right > sl + w) el.grid.scrollLeft = right - w
  }

  el.grid.addEventListener('keydown', function (e) {
    if (!state.obj) return
    var sel = state.sel || { v: 0, col: 0 }
    var page = Math.max(1, Math.floor(viewportRowsH() / ROW_H) - 1)
    var mod = e.metaKey || e.ctrlKey
    var next = null
    switch (e.key) {
      case 'ArrowDown': next = [mod ? Infinity : sel.v + 1, sel.col]; break
      case 'ArrowUp': next = [mod ? 0 : sel.v - 1, sel.col]; break
      case 'ArrowRight': next = [sel.v, mod ? Infinity : sel.col + 1]; break
      case 'ArrowLeft': next = [sel.v, mod ? 0 : sel.col - 1]; break
      case 'PageDown': next = [sel.v + page, sel.col]; break
      case 'PageUp': next = [sel.v - page, sel.col]; break
      case 'Home': next = mod ? [0, 0] : [sel.v, 0]; break
      case 'End': next = mod ? [Infinity, Infinity] : [sel.v, Infinity]; break
      case 'Escape':
        if (state.sel) {
          state.sel = null
          renderRows()
          renderDetail()
          e.preventDefault()
        }
        return
    }
    if (!next) return
    e.preventDefault()
    setSelection(next[0] === Infinity ? viewCount() - 1 : next[0], next[1] === Infinity ? state.columns.length - 1 : next[1], true)
  })

  // Column resize
  gHead.addEventListener('pointerdown', function (e) {
    var rz = e.target.closest('.rz')
    if (!rz) return
    e.preventDefault()
    var col = Number(rz.dataset.col)
    var startX = e.clientX
    var startW = state.widths[col]
    rz.setPointerCapture(e.pointerId)
    function move(ev) {
      state.widths[col] = Math.max(40, Math.round(startW + ev.clientX - startX))
      applyWidths()
    }
    function up() {
      rz.removeEventListener('pointermove', move)
      rz.removeEventListener('pointerup', up)
      rz.removeEventListener('pointercancel', up)
    }
    rz.addEventListener('pointermove', move)
    rz.addEventListener('pointerup', up)
    rz.addEventListener('pointercancel', up)
  })

  // ---- Detail pane and copy ------------------------------------------------------------------

  function selectedValue() {
    var sel = state.sel
    if (!sel || !state.obj || sel.v >= viewCount()) return null
    var row = readRowSafe(rowIndexOf(sel.v), true)
    if (row.error) return { error: row.error }
    var col = state.columns[sel.col]
    return { name: col.name, type: row.types[sel.col] || 'null', value: row.values[sel.col] }
  }

  function renderDetail() {
    var cur = state.obj && state.sel ? selectedValue() : null
    el.detail.hidden = !cur
    if (!cur) return
    el.detailHead.textContent = ''
    el.detailBody.className = ''
    el.detailBody.textContent = ''
    if (cur.error) {
      el.detailHead.textContent = 'Unreadable row'
      el.detailBody.textContent = cur.error
      return
    }
    var name = document.createElement('span')
    name.className = 'name'
    name.textContent = cur.name
    el.detailHead.appendChild(name)
    var label = cur.type
    if (cur.type === 'text') label += ' · ' + nf.format(cur.value.length) + ' characters'
    if (cur.type === 'blob') label += ' · ' + R.formatSize(cur.value.size)
    el.detailHead.appendChild(document.createTextNode(label))
    if (cur.type === 'null') {
      note('NULL')
    } else if (cur.type === 'generated') {
      note('This is a virtual generated column: SQLite computes it when queried, so its value isn’t stored in the file.')
    } else if (cur.type === 'blob') {
      el.detailBody.className = 'hex'
      var bytes = cur.value.bytes
      el.detailBody.textContent = hexDump(bytes.subarray(0, HEX_PREVIEW_BYTES))
      if (bytes.length > HEX_PREVIEW_BYTES) note('\nShowing the first ' + R.formatSize(HEX_PREVIEW_BYTES) + '. Copy gets the whole value as hex.')
    } else if (cur.type === 'text' && cur.value.length > DETAIL_TEXT_CHARS) {
      el.detailBody.textContent = cur.value.slice(0, DETAIL_TEXT_CHARS)
      note('\n\nShowing the first ' + nf.format(DETAIL_TEXT_CHARS) + ' characters. Copy gets the whole value.')
    } else {
      el.detailBody.textContent = cur.type === 'real' ? R.formatReal(cur.value) : String(cur.value)
    }
  }

  function note(text) {
    var s = document.createElement('span')
    s.className = 'note'
    s.textContent = text
    el.detailBody.appendChild(s)
  }

  document.addEventListener('copy', function (e) {
    var selection = window.getSelection()
    if (selection && !selection.isCollapsed && !el.grid.contains(selection.anchorNode)) return
    if (document.activeElement === el.filter) return
    var cur = state.sel ? selectedValue() : null
    if (!cur || cur.error || !e.clipboardData) return
    e.clipboardData.setData('text/plain', copyText(cur.value, cur.type))
    e.preventDefault()
  })

  // ---- Filter ----------------------------------------------------------------------------------

  var filterTimer = 0
  el.filter.addEventListener('input', function () {
    clearTimeout(filterTimer)
    filterTimer = setTimeout(function () {
      state.filterText = el.filter.value
      startFilter()
    }, 150)
  })
  el.filter.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && el.filter.value) {
      el.filter.value = ''
      state.filterText = ''
      startFilter()
    } else if (e.key === 'Enter' || e.key === 'ArrowDown') {
      e.preventDefault()
      el.grid.focus()
    }
  })

  function cancelFilter() {
    state.filterJob++
    state.filterProgress = null
  }

  // Scans the whole table in time slices so a million rows never freeze the frame; matches show
  // as they are found.
  function startFilter() {
    if (!state.obj) return
    cancelFilter()
    var job = state.filterJob
    var needle = state.filterText.trim().toLowerCase()
    state.sel = null
    if (!needle) {
      state.matches = null
      afterFilterChange()
      return
    }
    var obj = state.obj
    var total = obj.rowCount
    var matches = []
    state.matches = matches
    state.filterProgress = 0
    var i = 0
    afterFilterChange()
    function step() {
      if (job !== state.filterJob) return
      var until = performance.now() + 12
      while (i < total && performance.now() < until) {
        for (var n = 0; n < 200 && i < total; n++, i++) {
          var row = readRowSafe(i, false)
          if (row.error) continue
          if (row.rowid != null && String(row.rowid).indexOf(needle) >= 0) {
            matches.push(i)
            continue
          }
          for (var j = 0; j < row.values.length; j++) {
            var t = row.types[j]
            if (t === 'null' || t === 'generated' || t === 'blob') continue
            var text = t === 'real' ? R.formatReal(row.values[j]) : String(row.values[j])
            if (text.toLowerCase().indexOf(needle) >= 0) {
              matches.push(i)
              break
            }
          }
        }
      }
      state.filterProgress = i < total ? i / total : null
      layoutHeight()
      renderRows()
      renderStatus()
      if (i < total) setTimeout(step, 0)
    }
    setTimeout(step, 0)
  }

  function afterFilterChange() {
    layoutHeight()
    el.grid.scrollTop = 0
    renderRows()
    renderDetail()
    renderStatus()
  }

  // ---- Status ----------------------------------------------------------------------------------

  function renderStatus() {
    var db = state.db
    if (!db) return
    var info = db.info
    var parts = []
    if (!info.empty) {
      parts.push(nf.format(info.pageCount) + (info.pageCount === 1 ? ' page' : ' pages'))
      parts.push(R.formatSize(info.pageSize) + ' page size')
      parts.push(info.encoding)
      if (info.sqliteVersion) parts.push('SQLite ' + info.sqliteVersion)
    } else {
      parts.push('Empty file')
    }
    parts.push('Read-only')
    el.status.textContent = ''
    parts.forEach(function (p) {
      var s = document.createElement('span')
      s.textContent = p
      el.status.appendChild(s)
    })
    var grow = document.createElement('span')
    grow.className = 'grow'
    el.status.appendChild(grow)
    if (state.obj) {
      var right = document.createElement('span')
      var rows = nf.format(state.obj.rowCount) + (state.obj.rowCount === 1 ? ' row' : ' rows')
      if (state.matches) {
        right.textContent =
          nf.format(state.matches.length) + ' of ' + rows + (state.filterProgress != null ? ' · filtering ' + Math.floor(state.filterProgress * 100) + '%' : ' match')
      } else {
        right.textContent = rows
      }
      el.status.appendChild(right)
    }
  }

  // ---- Wiring ----------------------------------------------------------------------------------

  if (window.orca && window.orca.document) {
    // The editor is read-only: it follows every document Orca sends and never calls applyEdit.
    window.orca.document.onDidChange(function (doc) {
      try {
        load(doc)
      } catch (e) {
        showMessage('Can’t show this database', R.messageOf(e), 'Reopen the file. If it keeps happening, the file may be damaged.')
      }
    })
  } else {
    showMessage('Can’t show this file', 'SQLite Browser runs inside an Orca editor tab.', 'Open the database file in Orca.')
  }
})()
</script>
</body>
</html>
